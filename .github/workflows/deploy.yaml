name: Build & Deploy Moments

on:
  push:
    branches:
      # - main
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'moments-prod' || 'moments-dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: frontend
        run: |
          export VITE_APP_TITLE="${{ vars.VITE_APP_TITLE }}"
          export VITE_APP_KEYWORD="${{ vars.VITE_APP_KEYWORD }}"
          export VITE_APP_DESCRIPTION="${{ vars.VITE_APP_DESCRIPTION }}"
          export VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}"
          pnpm build

      - name: Install Backend Dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Build Backend
        working-directory: backend
        run: pnpm build

      - name: Prepare Docker Deploy Package
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package

          cp deploy/Dockerfile deploy-package/Dockerfile
          cp deploy/docker-compose.yml deploy-package/docker-compose.yml

          cp backend/package.json deploy-package/package.json
          cp backend/pnpm-lock.yaml deploy-package/pnpm-lock.yaml
          cp backend/pnpm-workspace.yaml deploy-package/pnpm-workspace.yaml
          cp -r backend/dist deploy-package/dist
          cp -r backend/prisma deploy-package/prisma

          mkdir -p deploy-package/public
          cp -r frontend/dist/* deploy-package/public/

          cat > deploy-package/app.env <<'APP_ENV_EOF'
          ${{ secrets.APP_ENV_FILE }}
          APP_ENV_EOF

          cat > deploy-package/compose.env <<EOF
          APP_CONTAINER_NAME=${{ vars.APP_CONTAINER_NAME }}
          APP_PORT=${{ vars.APP_PORT }}
          EOF

      - name: Prepare Upload Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            UPLOAD_PATH="/tmp/moments-deploy-${{ github.run_id }}"
            rm -rf "$UPLOAD_PATH"
            mkdir -p "$UPLOAD_PATH"

      - name: Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy-package/*"
          target: /tmp/moments-deploy-${{ github.run_id }}
          strip_components: 1
          overwrite: true

      - name: Deploy Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            UPLOAD_PATH="/tmp/moments-deploy-${{ github.run_id }}"
            DEPLOY_PATH="$(printf '%s' '${{ vars.DEPLOY_PATH }}' | tr -d '\r' | xargs)"
            test -n "$DEPLOY_PATH"

            mkdir -p "$DEPLOY_PATH"
            find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$UPLOAD_PATH"/. "$DEPLOY_PATH"/
            rm -rf "$UPLOAD_PATH"

            cd "$DEPLOY_PATH"
            APP_CONTAINER_NAME="$(grep '^APP_CONTAINER_NAME=' compose.env | cut -d= -f2- | tr -d '\r' | xargs)"
            test -n "$APP_CONTAINER_NAME"

            APP_IMAGE="moments-app:latest"
            ROLLBACK_IMAGE="moments-app:rollback"
            export APP_IMAGE
            COMPOSE="docker compose -f docker-compose.yml --env-file compose.env"

            # 备份当前正在运行的镜像，便于部署后健康检查失败时回滚
            OLD_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$APP_CONTAINER_NAME" 2>/dev/null || true)"
            if [ -n "$OLD_IMAGE_ID" ]; then
              docker tag "$OLD_IMAGE_ID" "$ROLLBACK_IMAGE"
              echo "已备份上一版本镜像：$ROLLBACK_IMAGE ($OLD_IMAGE_ID)"
            fi

            $COMPOSE build --pull app
            # 正常情况下直接重建容器（尽量缩短停机时间）；
            # 仅当同名容器由其他 compose 项目占用时才需要先清理再重试。
            if ! $COMPOSE up -d --remove-orphans app; then
              echo "启动失败，清理同名容器后重试"
              docker rm -f "$APP_CONTAINER_NAME" || true
              $COMPOSE up -d --remove-orphans app
            fi

            # 等待容器健康检查通过（镜像内配置了 HEALTHCHECK）
            health_status="unknown"
            for _ in $(seq 1 40); do
              health_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$APP_CONTAINER_NAME" 2>/dev/null || echo unknown)"
              case "$health_status" in
                healthy|running) break ;;
                unhealthy|exited|dead) break ;;
                *) sleep 3 ;;
              esac
            done

            if [ "$health_status" != "healthy" ] && [ "$health_status" != "running" ]; then
              echo "部署后健康检查失败：$health_status"
              docker logs --tail 120 "$APP_CONTAINER_NAME" || true
              if docker image inspect "$ROLLBACK_IMAGE" >/dev/null 2>&1; then
                echo "尝试回滚到上一版本镜像"
                APP_IMAGE="$ROLLBACK_IMAGE" $COMPOSE up -d --force-recreate app || true
              else
                echo "没有可用的回滚镜像"
              fi
              exit 1
            fi

            echo "部署成功，容器状态：$health_status"
            docker image prune -f
