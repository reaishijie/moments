services:
  db:
    image: mysql:8.0
    container_name: moments-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    ports:
      - "13306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - moments-net

  app:
    build: .
    container_name: moments-app
    restart: always
    ports:
      - "9889:9889"
    env_file:
      - .env.docker
    volumes:
      # 持久化自动生成的 JWT_SECRET，避免容器重建后所有登录态失效
      - app_data:/app/data
    depends_on:
      - db
    networks:
      - moments-net

volumes:
  db_data:
  app_data:

networks:
  moments-net:
